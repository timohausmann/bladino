#import "./weblink.graphql"
#import "./vote.graphql"

fragment CommentChildFields on Comment {
  id
  body
  dateCreated
  parent
  voteNum
  votes {
    ...VoteFields
  }
  user {
    id
    name
    avatar
  }
  files {
    id
    filename
    name
    type
    size
  }
  weblinks {
    ...WeblinkFields
  }
}
