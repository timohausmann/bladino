mutation Login($name: String!, $password: String!) {
  login(name: $name, password: $password)
}

mutation RequestMagic($handle: String!) {
  requestMagic(handle: $handle)
}

mutation LoginMagic($token: String!) {
  loginMagic(token: $token)
}

mutation UpdatePassword($id: ID!, $newpass: String!, $oldpass: String!) {
  updatePassword(id: $id, newpass: $newpass, oldpass: $oldpass)
}

query CurrentUser {
  currentUser {
    id
    name
    avatar
    email
    description
    dateCreated
  }
}
